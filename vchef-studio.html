<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VChef Performance Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
    .glass-card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- Header -->
  <div class="max-w-7xl mx-auto mb-8">
    <h1 class="text-3xl font-bold text-slate-800">📊 VChef Performance Studio</h1>
    <p class="text-slate-500">ระบบบันทึกผลงานรายบุคคลและวิเคราะห์ยอดขาย</p>
  </div>

  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- Input Section (Form) -->
    <div class="lg:col-span-1 space-y-6">
      <div class="glass-card p-6">
        <h3 class="font-bold text-lg mb-4 text-slate-800"><i class="fa-solid fa-pen-to-square mr-2"></i> บันทึกข้อมูลรายวัน</h3>
        <div class="space-y-4">
          <select id="pcSelect" class="w-full p-3 border rounded-xl"></select>
          <input type="date" id="dateInput" class="w-full p-3 border rounded-xl">
          <input type="text" id="branchInput" placeholder="ชื่อสาขา/ห้าง" class="w-full p-3 border rounded-xl">
          <div class="grid grid-cols-2 gap-2">
            <input type="number" id="wasabi" placeholder="Wasabi" class="p-3 border rounded-xl">
            <input type="number" id="hippo" placeholder="Hippo" class="p-3 border rounded-xl">
            <input type="number" id="cke" placeholder="CKE" class="p-3 border rounded-xl">
            <input type="number" id="umeshu" placeholder="Umeshu" class="p-3 border rounded-xl">
          </div>
          <button onclick="savePerformance()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition">บันทึกข้อมูล</button>
        </div>
      </div>
    </div>

    <!-- Analytics & History Section -->
    <div class="lg:col-span-2 space-y-6">
      <!-- KPI Summary Cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-indigo-600 p-4 rounded-2xl text-white">
          <p class="text-xs opacity-70">Total Sales</p>
          <h4 class="text-xl font-bold" id="totalSale">฿0</h4>
        </div>
        <!-- เพิ่ม Card อื่นๆ ได้ที่นี่ -->
      </div>

      <!-- Main Table -->
      <div class="glass-card p-6 overflow-x-auto">
        <h3 class="font-bold text-lg mb-4 text-slate-800">ประวัติการจัดชิม</h3>
        <table class="w-full text-sm text-left">
          <thead class="text-slate-500 border-b">
            <tr><th class="p-3">วันที่</th><th class="p-3">PC</th><th class="p-3">สาขา</th><th class="p-3">ยอดรวม</th></tr>
          </thead>
          <tbody id="performanceBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const supabase = window.supabase.createClient("YOUR_URL", "YOUR_KEY");

    // ฟังก์ชันรวมที่ดึงจาก Code เดิมของคุณ
    async function savePerformance() {
      // ... (ใช้ Logic เดิมในการ Save)
      alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
    }

    async function loadData() {
      // ... (ใช้ Logic ดึงข้อมูลและคำนวณ Ach%, Growth% ตามที่เคยทำ)
    }

    window.onload = loadData;
  </script>
</body>
</html>
