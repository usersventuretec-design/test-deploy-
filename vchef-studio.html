<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>VChef Performance Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Prompt', sans-serif; background: #f8fafc; }</style>
</head>
<body class="p-6">

<div class="max-w-6xl mx-auto">
  <h1 class="text-3xl font-bold mb-8">VChef Performance Studio</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
    <div class="bg-white p-6 rounded-xl shadow border-t-4 border-amber-500">
      <h3 class="font-bold mb-4">บันทึก VChef</h3>
      <select id="vcEmp" class="w-full p-2 border rounded mb-2"><option value="">-- เลือกพนักงาน --</option></select>
      <input type="number" id="vcDays" placeholder="วันจัดชิม" class="w-full p-2 border rounded mb-2">
      <div class="grid grid-cols-2 gap-2 mb-2">
        <input type="number" id="vcWasabi" placeholder="Wasabi" class="p-2 border rounded">
        <input type="number" id="vcHippo" placeholder="Hippo" class="p-2 border rounded">
        <input type="number" id="vcCke" placeholder="CKE" class="p-2 border rounded">
        <input type="number" id="vcUmesshu" placeholder="Umeshu" class="p-2 border rounded">
      </div>
      <button onclick="saveVChef()" class="w-full bg-amber-600 text-white p-2 rounded">บันทึก VChef</button>
    </div>

    <div class="bg-white p-6 rounded-xl shadow border-t-4 border-blue-500">
      <h3 class="font-bold mb-4">บันทึกยอดขายสาขา</h3>
      <select id="kpiEmp" class="w-full p-2 border rounded mb-2"><option value="">-- เลือกพนักงาน --</option></select>
      <input type="number" id="kpiTarget" placeholder="เป้ายอดขาย" class="w-full p-2 border rounded mb-2">
      <input type="number" id="kpiActual" placeholder="ยอดขายจริง" class="w-full p-2 border rounded mb-2">
      <button onclick="saveKPI()" class="w-full bg-blue-600 text-white p-2 rounded">บันทึกยอดขาย</button>
    </div>
  </div>

  <div class="bg-white p-6 rounded-xl shadow overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50"><tr><th class="p-2">พนักงาน</th><th class="p-2">ยอดรวม</th><th class="p-2">Action</th></tr></thead>
      <tbody id="dataTable"></tbody>
    </table>
  </div>
</div>

<script>
  const supabase = window.supabase.createClient("YOUR_URL", "YOUR_KEY");
  let employeesCache = [];

  window.onload = async () => {
    try {
      const { data, error } = await supabase.from('employees').select('*');
      if (error) throw error;
      employeesCache = data;
      console.log("Employees Loaded:", employeesCache);
      
      // เติมพนักงานลง Dropdown
      const vcEmp = document.getElementById('vcEmp');
      const kpiEmp = document.getElementById('kpiEmp');
      data.forEach(e => {
        const opt = `<option value="${e.id}">${e.name}</option>`;
        vcEmp.innerHTML += opt;
        kpiEmp.innerHTML += opt;
      });

      loadHistory();
    } catch (e) {
      console.error("Critical Load Error:", e);
      alert("โหลดข้อมูลพนักงานไม่สำเร็จ: " + e.message);
    }
  };

  async function saveVChef() {
    const p = {
      salesperson_id: document.getElementById('vcEmp').value,
      actual_demo_days: Number(document.getElementById('vcDays').value),
      sales_wasabi: Number(document.getElementById('vcWasabi').value),
      sales_hippo: Number(document.getElementById('vcHippo').value),
      sales_cke: Number(document.getElementById('vcCke').value),
      sales_umesshu: Number(document.getElementById('vcUmesshu').value)
    };
    await supabase.from('vchef_performance').insert([p]);
    loadHistory();
  }

  async function loadHistory() {
    const { data } = await supabase.from('vchef_performance').select('*');
    const tbody = document.getElementById('dataTable');
    tbody.innerHTML = '';
    
    if (data) {
      data.forEach(v => {
        const emp = employeesCache.find(e => e.id == v.salesperson_id);
        const total = (v.sales_wasabi || 0) + (v.sales_hippo || 0) + (v.sales_cke || 0) + (v.sales_umesshu || 0);
        tbody.innerHTML += `<tr>
          <td class="p-2">${emp ? emp.name : 'Unknown'}</td>
          <td class="p-2 text-emerald-600 font-bold">฿${total.toLocaleString()}</td>
          <td class="p-2 text-red-500 cursor-pointer" onclick="del('${v.id}')">ลบ</td>
        </tr>`;
      });
    }
  }

  async function del(id) {
    await supabase.from('vchef_performance').delete().eq('id', id);
    loadHistory();
  }
</script>
</body>
</html>
