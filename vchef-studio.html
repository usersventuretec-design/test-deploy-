<!DOCTYPE html>
<html lang="th">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Prompt', sans-serif; background: #f1f5f9; }</style>
</head>
<body class="p-4">

  <!-- สรุปตัวเลขสำคัญ (KPI Dashboard Card) -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-blue-600 p-4 rounded-xl text-white shadow-lg">
      <p class="text-sm opacity-80">YTD Actual</p>
      <h2 class="text-2xl font-bold" id="ytdActual">฿0</h2>
    </div>
    <div class="bg-emerald-600 p-4 rounded-xl text-white shadow-lg">
      <p class="text-sm opacity-80">YTD Achieved</p>
      <h2 class="text-2xl font-bold" id="ytdAch">0%</h2>
    </div>
    <div class="bg-amber-500 p-4 rounded-xl text-white shadow-lg">
      <p class="text-sm opacity-80">MTD Actual</p>
      <h2 class="text-2xl font-bold" id="mtdActual">฿0</h2>
    </div>
    <div class="bg-slate-700 p-4 rounded-xl text-white shadow-lg">
      <p class="text-sm opacity-80">Total Growth YOY</p>
      <h2 class="text-2xl font-bold" id="yoyGrowth">0%</h2>
    </div>
  </div>

  <!-- ตารางสรุปใหญ่ -->
  <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
    <table class="w-full text-xs">
      <thead>
        <tr class="bg-slate-800 text-white">
          <th class="p-2">Month</th><th class="p-2">Target</th><th class="p-2">Actual</th>
          <th class="p-2">Ach%</th><th class="p-2">DemoDay</th><th class="p-2">Sale/Day</th>
          <th class="p-2">Y25 Sale</th><th class="p-2">Growth%</th>
        </tr>
      </thead>
      <tbody id="mainTableBody" class="text-center"></tbody>
    </table>
  </div>

  <script>
    const supabase = window.supabase.createClient("YOUR_URL", "YOUR_KEY");

    async function loadDashboard() {
      const { data } = await supabase.from('monthly_performance').select('*');
      const tbody = document.getElementById('mainTableBody');
      
      let totalActual = 0, totalTarget = 0, totalPrev = 0;
      tbody.innerHTML = '';

      data.forEach(row => {
        const actual = row.wasabi + row.hippo + row.cke + row.umesshu;
        const ach = (actual / row.target) * 100;
        const growth = ((actual - row.prev_year_sale) / row.prev_year_sale) * 100;
        const saleDay = actual / row.actual_demoday;

        totalActual += actual;
        totalTarget += row.target;
        totalPrev += row.prev_year_sale;

        tbody.innerHTML += `
          <tr class="border-b hover:bg-slate-50">
            <td class="p-2 font-bold">${row.month}</td>
            <td class="p-2">${row.target.toLocaleString()}</td>
            <td class="p-2 text-blue-600 font-bold">${actual.toLocaleString()}</td>
            <td class="p-2">${ach.toFixed(0)}%</td>
            <td class="p-2">${row.actual_demoday}</td>
            <td class="p-2">${saleDay.toLocaleString(undefined, {maximumFractionDigits:0})}</td>
            <td class="p-2">${row.prev_year_sale.toLocaleString()}</td>
            <td class="p-2 ${growth >=0 ? 'text-emerald-600' : 'text-red-500'}">${growth.toFixed(1)}%</td>
          </tr>
        `;
      });

      // Update Summary Cards
      document.getElementById('ytdActual').innerText = `฿${totalActual.toLocaleString()}`;
      document.getElementById('ytdAch').innerText = `${((totalActual/totalTarget)*100).toFixed(0)}%`;
      document.getElementById('yoyGrowth').innerText = `${(((totalActual-totalPrev)/totalPrev)*100).toFixed(1)}%`;
    }
    
    window.onload = loadDashboard;
  </script>
</body>
</html>
